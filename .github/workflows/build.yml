name: Build

"on":
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# Keep main releases in order because the application declaration uses :latest.
concurrency:
  group: graph-lab-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      age:
        image: apache/age:release_PG17_1.7.0
        env:
          POSTGRES_USER: graphlab
          POSTGRES_PASSWORD: graphlab-test
          POSTGRES_DB: graphlab
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U graphlab -d graphlab"
          --health-interval 5s --health-timeout 5s --health-retries 12
    env:
      AGE_TEST_DATABASE_URL: postgresql://graphlab:graphlab-test@127.0.0.1:5432/graphlab
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Lint and typecheck
        run: npm run check
      - run: npm test
      - run: npm run test:age
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - run: docker build -f docker/platform/Dockerfile -t graph-lab:ci .

  publish:
    if: github.event_name == 'push'
    needs: verify
    runs-on: ubuntu-latest
    outputs:
      digest: ${{ steps.push.outputs.digest }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - id: push
        uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/platform/Dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            eseidinger/graph-lab:latest
            eseidinger/graph-lab:sha-${{ github.sha }}

  deploy:
    if: github.event_name == 'push'
    needs: publish
    uses: ./.github/workflows/deploy.yml
    with:
      expected_digest: ${{ needs.publish.outputs.digest }}
    secrets: inherit
